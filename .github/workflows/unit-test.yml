name: Run Unit Tests

on:
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout zlux-server-framework (PR branch)
        uses: actions/checkout@v4
        with:
          path: zlux-server-framework

      - name: Determine target branch
        id: branch
        run: echo "name=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout zlux-shared
        uses: actions/checkout@v4
        with:
          repository: zowe/zlux-shared
          ref: ${{ steps.branch.outputs.name }}
          path: zlux-shared

      - name: Checkout zlux-platform
        uses: actions/checkout@v4
        with:
          repository: zowe/zlux-platform
          ref: ${{ steps.branch.outputs.name }}
          path: zlux-platform

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Debug directory structure
        run: |
          echo "=== github.workspace ==="
          echo "${{ github.workspace }}"
          echo "=== workspace contents ==="
          ls -laR ${{ github.workspace }}/zlux-shared/ | head -50
          echo "=== zlux-platform ==="
          ls -laR ${{ github.workspace }}/zlux-platform/ | head -50

      - name: Build zlux-shared
        run: |
          cd ${{ github.workspace }}/zlux-shared
          ls -la
          if [ -d "lib" ]; then
            cd lib && npm install && npm run build
          else
            echo "No lib/ directory found, listing contents:"
            find . -name "package.json" -maxdepth 3
          fi

      - name: Build zlux-platform
        run: |
          cd ${{ github.workspace }}/zlux-platform
          ls -la
          if [ -d "interface" ]; then
            cd interface && npm install && npm run build
          else
            echo "No interface/ directory found, listing contents:"
            find . -name "package.json" -maxdepth 3
          fi

      - name: Install zlux-server-framework dependencies
        run: |
          cd ${{ github.workspace }}/zlux-server-framework
          npm install

      - name: Build zlux-server-framework
        run: |
          cd ${{ github.workspace }}/zlux-server-framework
          npm run build

      - name: Run tests with coverage
        run: |
          cd ${{ github.workspace }}/zlux-server-framework
          npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: ${{ github.workspace }}/zlux-server-framework/coverage/
          retention-days: 30