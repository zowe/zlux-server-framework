name: Run Unit Tests

on:
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout zlux-server-framework (PR branch)
        uses: actions/checkout@v4
        with:
          path: zlux-server-framework

      - name: Determine target branch
        id: branch
        run: echo "name=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout zlux-shared
        uses: actions/checkout@v4
        with:
          repository: zowe/zlux-shared
          ref: ${{ steps.branch.outputs.name }}
          path: zlux-shared

      - name: Checkout zlux-platform
        uses: actions/checkout@v4
        with:
          repository: zowe/zlux-platform
          ref: ${{ steps.branch.outputs.name }}
          path: zlux-platform

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Debug layout before rearrange
        run: |
          echo "=== GITHUB_WORKSPACE: ${{ github.workspace }} ==="
          ls -la ${{ github.workspace }}/
          echo "=== parent ==="
          ls -la ${{ github.workspace }}/../

      - name: Rearrange directories as siblings
        run: |
          WORK_ROOT=${{ github.workspace }}/..
          # Move all three repos to be siblings under WORK_ROOT
          # zlux-server-framework is checked out at $GITHUB_WORKSPACE/zlux-server-framework
          # We need:
          #   WORK_ROOT/zlux-server-framework/  (with package.json etc)
          #   WORK_ROOT/zlux-shared/
          #   WORK_ROOT/zlux-platform/
          
          # zlux-shared and zlux-platform are at $GITHUB_WORKSPACE/zlux-shared etc
          # Move them up one level
          mv ${{ github.workspace }}/zlux-shared $WORK_ROOT/zlux-shared
          mv ${{ github.workspace }}/zlux-platform $WORK_ROOT/zlux-platform
          
          # zlux-server-framework contents are at $GITHUB_WORKSPACE/zlux-server-framework/
          # The workspace dir itself IS named zlux-server-framework, so
          # $GITHUB_WORKSPACE/zlux-server-framework/ = WORK_ROOT/zlux-server-framework/zlux-server-framework/
          # We need to move those files up into $GITHUB_WORKSPACE directly
          cp -r ${{ github.workspace }}/zlux-server-framework/* ${{ github.workspace }}/
          cp -r ${{ github.workspace }}/zlux-server-framework/.[!.]* ${{ github.workspace }}/ 2>/dev/null || true
          rm -rf ${{ github.workspace }}/zlux-server-framework

          echo "=== Verify layout ==="
          echo "--- WORK_ROOT ---"
          ls -la $WORK_ROOT/
          echo "--- workspace (should be zlux-server-framework contents) ---"
          ls -la ${{ github.workspace }}/
          echo "--- zlux-shared ---"
          ls -la $WORK_ROOT/zlux-shared/
          echo "--- zlux-platform ---"
          ls -la $WORK_ROOT/zlux-platform/

      - name: Install zlux-server-framework dependencies
        run: |
          cd ${{ github.workspace }}
          npm install

      - name: Build zlux-shared logger
        run: |
          cd ${{ github.workspace }}/../zlux-shared/src/logging
          ${{ github.workspace }}/node_modules/.bin/tsc logger.ts ../../../zlux-platform/interface/src/index.d.ts --module commonjs --target es5 --skipLibCheck --outDir .

      - name: Build zlux-server-framework
        run: |
          cd ${{ github.workspace }}
          npm run build

      - name: Run tests with coverage
        run: |
          cd ${{ github.workspace }}
          npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: ${{ github.workspace }}/coverage/
          retention-days: 30