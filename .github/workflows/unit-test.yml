name: Run Unit Tests

on:
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout zlux-server-framework (PR branch)
        uses: actions/checkout@v4
        with:
          path: zlux-server-framework

      - name: Determine target branch
        id: branch
        run: echo "name=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout zlux-shared
        uses: actions/checkout@v4
        with:
          repository: zowe/zlux-shared
          ref: ${{ steps.branch.outputs.name }}
          path: zlux-shared

      - name: Checkout zlux-platform
        uses: actions/checkout@v4
        with:
          repository: zowe/zlux-platform
          ref: ${{ steps.branch.outputs.name }}
          path: zlux-platform

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Rearrange directories as siblings
        run: |
          # GitHub workspace is /home/runner/work/zlux-server-framework/zlux-server-framework
          # path: X puts repos at $GITHUB_WORKSPACE/X
          # But relative requires like ../../zlux-shared expect repos to be siblings
          # of zlux-server-framework. So we move them one level up.
          mv ${{ github.workspace }}/zlux-shared ${{ github.workspace }}/../zlux-shared
          mv ${{ github.workspace }}/zlux-platform ${{ github.workspace }}/../zlux-platform
          mv ${{ github.workspace }}/zlux-server-framework ${{ github.workspace }}/../zlux-server-framework-temp
          mv ${{ github.workspace }}/../zlux-server-framework-temp ${{ github.workspace }}/

          echo "=== Verify layout ==="
          echo "--- workspace parent ---"
          ls -la ${{ github.workspace }}/../
          echo "--- workspace ---"
          ls -la ${{ github.workspace }}/

      - name: Build zlux-shared logger
        run: |
          cd ${{ github.workspace }}/../zlux-shared/src/logging
          npx tsc logger.ts ../../../zlux-platform/interface/src/index.d.ts --module commonjs --target es5 --skipLibCheck --outDir .

      - name: Install zlux-server-framework dependencies
        run: |
          cd ${{ github.workspace }}
          npm install

      - name: Build zlux-server-framework
        run: |
          cd ${{ github.workspace }}
          npm run build

      - name: Run tests with coverage
        run: |
          cd ${{ github.workspace }}
          npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: ${{ github.workspace }}/coverage/
          retention-days: 30