swagger: "2.0"
info:
  description: "PassTicket generation API provided by ZSS. Generates RACF PassTickets via the IRRSGS callable service for use in authenticating to downstream services that accept PassTicket-based credentials."
  version: "1.0.0"
  title: "ZSS PassTicket API"
  license:
    name: "EPL-2.0"
host: "localhost"
basePath: /
tags:
- name: "passticket"
  description: "PassTicket generation"
schemes:
- "https"
- "http"
paths:
  /passticket:
    post:
      tags:
      - "passticket"
      summary: "Generate a PassTicket"
      description: "Generates a RACF PassTicket for the authenticated user and the specified application name (APPLID). Requires a valid ZSS session cookie. The APPLID must correspond to a PTKTDATA profile defined in the RACF PTKTDATA class."
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "PassTicket generation request"
        required: true
        schema:
          $ref: "#/definitions/PassTicketRequest"
      responses:
        200:
          description: "PassTicket generated successfully"
          schema:
            $ref: "#/definitions/PassTicketResponse"
        400:
          description: "Invalid or missing applicationName"
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: "Not authenticated - missing or invalid session cookie"
        405:
          description: "Method not allowed - only POST is supported"
          schema:
            $ref: "#/definitions/ErrorResponse"
        500:
          description: "PassTicket generation failed (SAF/RACF error)"
          schema:
            $ref: "#/definitions/ErrorResponse"
      security:
      - zssCookie: []
securityDefinitions:
  zssCookie:
    type: "apiKey"
    name: "jedHTTPSession"
    in: "cookie"
    description: "ZSS session cookie obtained via POST /login"
definitions:
  PassTicketRequest:
    type: "object"
    required:
    - "applicationName"
    properties:
      applicationName:
        type: "string"
        description: "RACF application name (APPLID) for which to generate the PassTicket. Must be 1-8 alphanumeric characters matching a PTKTDATA profile."
        minLength: 1
        maxLength: 8
        pattern: "^[A-Za-z0-9@#$]{1,8}$"
        example: "MYAPP"
  PassTicketResponse:
    type: "object"
    properties:
      userId:
        type: "string"
        description: "The user ID for which the PassTicket was generated"
        example: "IBMUSER"
      applicationName:
        type: "string"
        description: "The application name used for generation"
        example: "MYAPP"
      ticket:
        type: "string"
        description: "The generated 8-character PassTicket"
        example: "ABCD1234"
  ErrorResponse:
    type: "object"
    properties:
      error:
        type: "string"
        description: "Error message describing what went wrong"
        example: "Failed to generate PassTicket"
